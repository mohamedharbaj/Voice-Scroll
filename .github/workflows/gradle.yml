name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: android

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # كنستعملو Gradle 8.5 مباشرة بلا gradle-wrapper.jar (الملف اللي فالمشروع قديم 4.4.1 وكيفشل فالتحقق)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        validate-wrappers: false

    # local.properties فيه مسار SDK ديال جهازك، خاصنا نحيدوه باش يستعمل SDK ديال GitHub
    - name: Remove local.properties
      run: rm -f local.properties

    - name: Build release APK
      run: gradle assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VoiceScroll-release-apk
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
